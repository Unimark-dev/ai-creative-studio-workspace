@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181b; --sheet: #1e2226; --ink: #eceff1; --muted: #a0a8b1; --line: #3a4148; --frame: #0d0f11;

} }
:root[data-theme="dark"] {
  --bg: #15181b; --sheet: #1e2226; --ink: #eceff1; --muted: #a0a8b1; --line: #3a4148; --frame: #0d0f11;

h1 { font-size: 24px; line-height: 1.2; font-weight: 700; margin: 0; }
h2 { font-size: 17px; font-weight: 600; margin: 0; }
h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; }
p { margin: 0; }
a { color: inherit; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }
.top { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }

.meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input[type=text], input[type=url], input[type=number], textarea, select { font: 400 15px/1.4 var(--sans); width: 100%; padding: 9px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 3px; min-width: 0; }
textarea { min-height: 76px; resize: vertical; }
input[type=number] { width: 96px; }
button { font: 600 14px var(--sans); padding: 9px 14px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 3px; cursor: pointer; }
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
button.chip { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; font-size: 13px; padding: 6px 11px; }
button.proj { display: inline-flex; align-items: center; gap: 8px; padding: 4px 11px 4px 4px; max-width: 100%; }
[dir="rtl"] button.proj { padding: 4px 4px 4px 11px; }
button.proj img { width: 34px; height: 34px; object-fit: cover; display: block; flex: none; }
button.proj span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.confirm { background: var(--marker); border-color: var(--marker); color: var(--marker-ink); }
button:disabled { opacity: .5; cursor: default; }
.status { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.status.err { color: var(--marker); }
.status.ok { color: var(--good); }
.spin { width: 11px; height: 11px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; flex: none; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: s 1s linear infinite; } @keyframes s { to { transform: rotate(360deg); } } }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); padding: 3px 8px 3px 3px; min-width: 0; }

.sw i { width: 20px; height: 20px; display: block; border: 1px solid var(--line); flex: none; }
.src { font: 500 10.5px var(--mono); color: var(--muted); border: 1px solid var(--line); padding: 0 5px; border-radius: 2px; white-space: nowrap; margin-inline-start: 4px; }
ul.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.dirs { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.dir { border: 1px solid var(--line); padding: 12px; display: grid; gap: 6px; align-content: start; background: transparent; color: var(--ink); text-align: start; font: 400 14px/1.5 var(--sans); }
.dir[aria-pressed="true"] { border-color: var(--marker); box-shadow: inset 0 0 0 1px var(--marker); }
.dir b { font-size: 15px; }
.sheet { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); align-items: start; }
.shot { background: var(--sheet); border: 1px solid var(--line); padding: 10px; display: grid; gap: 8px; min-width: 0; }
.mat { background: var(--frame); padding: 8px; display: flex; justify-content: center; align-items: center; height: 300px; position: relative; }
.mat img { display: block; max-width: 100%; max-height: 100%; }
.mark { position: absolute; top: 6px; inset-inline-start: 6px; font: 600 11px var(--sans); padding: 2px 7px; background: var(--marker); color: var(--marker-ink); border-radius: 2px; }
.check { font-size: 13px; padding: 7px 9px; border-inline-start: 3px solid var(--warn); background: var(--bg); overflow-wrap: anywhere; }
.check.fine { border-color: var(--good); }
details > summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details[open] > summary { margin-bottom: 8px; }
.empty { border: 1px dashed var(--line); padding: 22px; color: var(--muted); }
.cb { display: flex; gap: 7px; align-items: flex-start; font-size: 13px; color: var(--ink); }
.cb input { margin-top: 3px; }
footer { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 12px; }

      c.appendChild(el('div', { class: 'check' + (fine ? ' fine' : '') }, fine ? T.qcOk : T.qc + ' ' + (d.check.issues || []).join(' · ')));
    }
    if (d.final) c.appendChild(el('a', { href: d.final, target: '_blank', rel: 'noopener', class: 'meta', text: T.open }));
    var tabs = el('div', { class: 'row' });
    [['format', T.convert], ['edit', T.editT], ['text', T.textEdit]].forEach(function (t) {
      tabs.appendChild(el('button', { type: 'button', class: 'chip', disabled: busy, 'aria-pressed': String(u.open === t[0]), text: t[1], on: { click: function () { u.open = u.open === t[0] ? '' : t[0]; u.cost = null; if (t[0] === 'text' && u.headline === undefined) { u.headline = (d.copy || {}).headline || ''; u.sub = (d.copy || {}).sub || ''; u.cta = (d.copy || {}).cta || ''; } render(); } } }));
    });
    c.appendChild(tabs);
    if (u.open === 'format') {
      c.appendChild(formatPicker(u, function () { u.cost = null; }));
      var target = u.custom ? { name: T.custom + ' ' + u.w + 'x' + u.h, w: +u.w, h: +u.h } : { name: u.format[0], w: u.format[1], h: u.format[2] };
      if (u.cost != null && u.plan) {
        c.appendChild(el('p', { class: 'meta', text: T.method[u.plan.method] }));
        c.appendChild(el('div', {}, btn(T.confirm + ' ' + u.cost + ' ' + T.credits, function () { runConvert(d, u); }, 'confirm')));
      } else {
        c.appendChild(el('div', {}, btn(T.check, function () { if (!validSize(target)) { setStatus(T.badSize, 'err'); return; } costConvert(d, target, u); })));
      }
    }
    if (u.open === 'edit') {
      c.appendChild(el('textarea', { disabled: busy, placeholder: T.editPh, text: u.text, 'aria-label': T.editT, on: { input: function (e) { u.text = e.target.value; u.cost = null; } } }));
      c.appendChild(el('label', { class: 'cb' }, el('input', { type: 'checkbox', checked: u.keep, disabled: busy, on: { change: function (e) { u.keep = e.target.checked; u.cost = null; render(); } } }), el('span', { text: T.keep })));
      if (u.keep) c.appendChild(el('p', { class: 'meta', text: T.partial }));
      c.appendChild(el('div', {}, u.cost != null ? btn(T.confirm + ' ' + u.cost + ' ' + T.credits, function () { runEdit(d, u); }, 'confirm') : btn(T.check, function () { costEdit(d, u); })));
    }
    if (u.open === 'text') {
      c.appendChild(field(T.headline, input('text', u.headline, function (v) { u.headline = v; }, { dir: 'auto' })));
      c.appendChild(field(T.sub, input('text', u.sub, function (v) { u.sub = v; }, { dir: 'auto' })));
      c.appendChild(field(T.cta, input('text', u.cta, function (v) { u.cta = v; }, { dir: 'auto' })));
      c.appendChild(el('div', {}, btn(T.apply, function () { applyText(d, u); })));
    }
    return c;
  }
  function renderDesigns() {
    var s = el('section', { class: 'stack' }, el('h2', { text: T.designs }));
    var ds = ((state.p && state.p.designs) || []).filter(function (d) { return !form.concept || (d.concept || d.id) === form.concept; });
    if (!ds.length) { s.appendChild(el('p', { class: 'empty', text: T.none })); return s; }
    var g = el('div', { class: 'sheet' }); ds.forEach(function (d) { g.appendChild(renderCard(d)); });
    s.appendChild(g);
    return s;
  }
  function applyDir() { document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; }
  function render() {
    var app = document.getElementById('app');
    var prev = statusEl ? { text: statusEl.textContent, cls: statusEl.className, spin: !!statusEl.querySelector('.spin') } : null;
    app.textContent = '';
    app.appendChild(renderHeader());
    statusEl = el('div', { class: 'status', role: 'status' });
    if (prev && prev.text) { statusEl.className = prev.cls; if (prev.spin) statusEl.appendChild(el('span', { class: 'spin' })); statusEl.appendChild(document.createTextNode(prev.text)); }
    app.appendChild(statusEl);
    if (!mcp) app.appendChild(el('div', { class: 'check', text: T.noMcp }));
    if (!sample) app.appendChild(el('div', { class: 'check', text: T.noSample }));
    if (!db) app.appendChild(el('div', { class: 'check', text: T.noDb }));
    if (state.p && state.p.brand) app.appendChild(renderProjects());
    app.appendChild(renderBrand());
    app.appendChild(renderCreate());
    app.appendChild(renderDesigns());
    app.appendChild(el('footer', { text: T.note }));
  }

  /* ---------- start ---------- */
  applyDir();
  newProject();
  render();
  var C = window.claude;
  if (!C || !C.use) return;
  Promise.all(['mcp', 'sample', 'db', 'assets'].map(function (n) { return C.use(n).catch(function () { return null; }); })).then(function (r) {
    mcp = r[0]; sample = r[1]; db = r[2]; assets = r[3];
    render();
    if (!db) return;
    // Live, so a brand imported from the chat appears here without a reload.
    var seen = {};
    db.collection('projects').orderBy('created', 'desc').limit(50).onSnapshot(function (snap) {
      var first = !Object.keys(seen).length, arrived = null, present = {};
      snap.docs.forEach(function (d) { var x = d.data(); if (x && x.id) present[x.id] = 1; });
      // A brand deleted elsewhere leaves this view too, and can be imported again later.
      Object.keys(seen).forEach(function (id) {
        if (present[id]) return;
        delete seen[id];
        state.projects = state.projects.filter(function (p) { return p.id !== id; });
        if (!busy && state.p && state.p.id === id) { state.p = state.projects[0] || null; if (!state.p) newProject(); resetForm(); render(); }
      });
      snap.docs.forEach(function (d) {
        var data = d.data();
        if (!data || !data.id || seen[data.id]) return;
        seen[data.id] = 1;
        if (!state.projects.some(function (p) { return p.id === data.id; })) { state.projects.push(JSON.parse(JSON.stringify(data))); arrived = state.projects[state.projects.length - 1]; }
      });
      if (!arrived) return;
      state.projects.sort(function (a, b) { return (b.created || 0) - (a.created || 0); });
      // Open a newly arrived brand, unless the user is busy or already working in one.
      if (!busy && (first || !state.p || !state.p.brand)) { state.p = state.projects[0]; form.directions = []; form.direction = null; form.cost = null; render(); }
      else if (!busy) { var sel = state.p; render(); state.p = sel; setStatus(T.arrived + (arrived.name || ''), 'ok'); }
    }, function () { render(); });
  });
})();
</script>
